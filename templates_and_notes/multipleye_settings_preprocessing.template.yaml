# Configuration loading precedence for run_multipleye_preprocessing:
# 1) Explicit path via `--config_path` in CLI or `settings.load(path)` in code.
# 2) Environment variable `MULTIPLEYE_CONFIG` pointing to a YAML file.
# 3) `multipleye_settings_preprocessing.yaml` in the current working directory.
#
# If none are found, the pipeline copies this template into the current
# working directory as `multipleye_settings_preprocessing.yaml` and stops.
# You must edit the copied file (especially data_collection_name) and rerun.
# Docs: https://multipleye-cost.github.io/multipleye-preprocessing/guide/configuration/

# ----------------------- User Parameters -----------------------

# --- REQUIRED ---
# Unique identifier for the data collection.
# Format: MultiplEYE_[LANGUAGE]_[COUNTRY]_[LAB]_[COLLECTION_NUMBER]_[YEAR]
# Example: MultiplEYE_DA_DK_Aalborg_1_2026
data_collection_name: "REPLACE_WITH_YOUR_COLLECTION_NAME"

# --- COMMON SETTINGS (frequently changed) ---
# The type of experiment being processed.
experiment_type: "MultiplEYE" # MultiplEYE or MeRID

# Whether to recalculate existing preprocessed files.
# If false, already preprocessed sessions are skipped.
# Note: If some files exist, recalculate once to ensure version consistency.
# Note: Activate recalculate whenever changing input files e.g. the stimulus order
recalculate: false

# List of session identifiers to explicitly include. If not empty, only these are processed.
include_sessions: [] # e.g., ["000_DA_DK_1_ET1"]

# List of session identifiers to explicitly exclude from processing.
exclude_sessions: []

# Whether to include sessions from the pilot folder.
include_pilots: false

# The expected sampling rate of the eye tracker in Hertz.
expected_sampling_rate_hz: 1000

# Whether to use aoi overlay or only stimulus images for plotting.
plot_aoi_overlay: true

# Whether to copy AOI images overlay to the output directory.
copy_aoi_images_overlay: false

# Whether this language uses custom units of analysis (aois) instead of the default MultiplEYE aois (white space delimited)
custom_uoas: false

# ----------------------- Internal Usage -----------------------

# --- LOGGING ---
log_level: "INFO"
console_log_level: "INFO"
file_log_level: "DEBUG"
append_logs: false
ignored_log_regexes:
  - "Could not determine dtype for column \\d+, falling back to string"

# --- SESSION DISCOVERY (do not change) ---
ignored_session_folders:
  - "test_sessions"
  - "core_sessions"
  - "pilot_sessions"

# --- QUALITY CHECK THRESHOLDS (do not change) ---
acceptable_num_calibrations: [3, 30]
acceptable_num_validation: [13, 30]
acceptable_avg_validation_scores: [0.0, 0.8]
acceptable_max_validation_scores: [0.0, 1.5]
acceptable_validation_errors: ["GOOD"]
acceptable_data_loss_ratios: [0.0, 0.1]
acceptable_recording_durations: [600, 7200]
acceptable_num_practice_trials: 2
acceptable_num_trials: 10
# Minimum number of completed trials (stimulus_order_ids) before a session is flagged as incomplete.
# MultiplEYE full session = 12, MeRID split = 6, crash = <6.
acceptable_num_completed_trials: 6
# Single validation classification thresholds (used for GOOD/MODERATE/BAD).
single_validation_good_max: 0.305
single_validation_moderate_max: 0.45

# --- PSYCHOMETRIC TEST THRESHOLDS ---
# Minimum reaction time for WikiVocab in seconds.
psym_wikivocab_min_rt: 0.2

# Maximum reaction time for WikiVocab in seconds. `.inf` (infinite) means no upper limit.
psym_wikivocab_max_rt: .inf

# Minimum reaction time for Stroop in seconds.
psym_stroop_min_rt: 0.2

# Maximum reaction time for Stroop in seconds.
psym_stroop_max_rt: .inf

# Minimum reaction time for Flanker in seconds.
psym_flanker_min_rt: 0.0

# Maximum reaction time for Flanker in seconds.
psym_flanker_max_rt: .inf

# --- EYE TRACKER LABELS (do not change) ---
tracked_eye: ["L", "R", "RIGHT", "LEFT"]

# --- PIPELINE STAGES ---
# Whether to run the preflight input file check before processing.
RUN_PREFLIGHT_CHECK: true
# Whether to perform fixation detection.
RUN_FIXATION_DETECTION: true
# Whether to perform saccade detection.
RUN_SACCADE_DETECTION: true
# Whether to perform reading measures calculation.
RUN_READING_MEASURES: true
# Whether to collect comprehension question answers.
RUN_COMPREHENSION_ANSWERS: true
# Whether to create sanity check reports.
RUN_SANITY_CHECKS: true
# Whether to process psychometric tests.
RUN_PSYCHOMETRIC_TESTS: true

# --- INTERNAL (do not change) ---
# Whether to force reconversion of EDF files to ASC even if output exists.
force_reconvert_asc: false
raw_data_folder: "raw_data/"
fixations_folder: "fixations/"
saccades_folder: "saccades/"
scanpaths_folder: "scanpaths/"
reading_measures_folder: "reading_measures/"
sanity_checks_folder: "sanity_checks/"
metadata_folder: "metadata/"
answers_folder: "comp_answers/"
psychometric_tests_folder: "psychometric_tests/"
trial_cols: ["trial", "stimulus", "page"]
trial_col: "trial"
page_col: "page"
stimulus_col: "stimulus"
word_idx_col: "word_idx"
char_idx_col: "char_idx"
