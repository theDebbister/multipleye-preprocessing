[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MultiplEYE-preprocessing"
version = "2026.08.28"
description = "Pipeline for Multipleye data preprocessing"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "matplotlib>=3.8.4",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pillow==12.2.0",
    "polars>=1.28.1",
    "pymovements>=0.28.0",
    "tqdm>=4.66.4",
    "openpyxl>=3.0.0",
    "ipykernel>=7.1.0",
    "jupyterlab",
    "ipywidgets",
    "sphinxcontrib-mermaid>=2.0.2",
]

#[tool.uv.sources]
# this can be used to get a pymovements version from the git repo, before a version releases:
#pymovements = { git = "https://github.com/pymovements/pymovements.git", branch = "main" }

[project.optional-dependencies]
review = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.35.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pycountry>=24.6.1",
]

[tool.setuptools.packages.find]
include = ["preprocessing", "review_app"]

[tool.ruff]
# Notebooks are templates/notes, not shipped code; ruff 0.16 lints them by default.
exclude = ["*.ipynb"]

[tool.ruff.lint]
# Rules deliberately not enforced. These are the 0.16 default rules that
# conflict with established codebase patterns; kept as explicit ignores so
# the effective lint set is reproducible across dev and CI.
ignore = [
    "ASYNC220",  # subprocess in async routes (FastAPI pattern, blocking is intentional)
    "ASYNC230",  # open() in async routes (FastAPI pattern, blocking is intentional)
    "BLE001",  # blind except: pipeline deliberately catches broadly and logs
    "LOG015",  # root logger calls: codebase uses the logging module directly
    "RUF012",  # mutable class attribute defaults (dataclass-like pattern)
    "S112",  # try-except-continue: psychometric tests deliberately skip and continue
    "SIM113",  # index-based loop is intentional (index used into stimuli_order)
]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "docs" }]
lint = [
    "pre-commit>=4.5.1",
    "pytest>=7.0.0",
    "ruff==0.16.3",
]
docs = [
    "myst-nb>=1.3.0",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-bibtex>=2.6.5",
]

[project.scripts]
restructure_psychometric_tests = "preprocessing.scripts.restructure_psycho_tests:main"
prepare_language_folder = "preprocessing.scripts.prepare_language_folder:main"
preprocess_psychometric_tests = "preprocessing.scripts.psychometric_tests:process_all_psychometric_test_sessions"
# Pipelines
run_preprocessing = "preprocessing.scripts.run_preprocessing:main"
# Review web UI
review_web = "review_app.main:run"
